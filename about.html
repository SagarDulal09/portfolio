<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us</title>
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    .about-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .metric-card {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
    }

    .metric-card h3 {
      font-size: 2rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main class="about-page">
    <section>
      <h1 style="font-size: 2.25rem; margin-bottom: 0.75rem;">Engineering Digital Systems</h1>
      <p style="color: #94a3b8; font-size: 1.1rem;">We design and deliver modular software, efficient management panels, and responsive online platforms.</p>
    </section>

    <section class="metrics-grid">
      <div class="metric-card">
        <h3>99.9%</h3>
        <p style="color: #cbd5e1; margin-top: 0.5rem;">Uptime Score</p>
      </div>
      <div class="metric-card">
        <h3>150+</h3>
        <p style="color: #cbd5e1; margin-top: 0.5rem;">Completed Projects</p>
      </div>
      <div class="metric-card">
        <h3>24/7</h3>
        <p style="color: #cbd5e1; margin-top: 0.5rem;">System Support</p>
      </div>
    </section>
  </main>
</body>
</html>
