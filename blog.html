<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Insights & Blog | Sagar Dulal</title>
  <style>
    :root { --bg: #05050b; --neon-cyan: #00f0ff; --border: rgba(157, 78, 221, 0.2); --text-sub: #94a3b8; }
    body { background: var(--bg); color: #fff; font-family: system-ui, sans-serif; padding: 4rem 8%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem; }
    .card { background: rgba(13, 14, 24, 0.85); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
  </style>
</head>
<body>
  <a href="/" style="color:var(--neon-cyan); text-decoration:none;">&larr; Home</a>
  <h1>Published <span>Articles</span></h1>
  <div class="grid" id="blog-grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const db = getFirestore(initializeApp({ apiKey: "AIzaSyDmsV5ZCHn2BqaOWL0zNa-mq60Y7DX1EhE", authDomain: "sagar-portfolio-dabc5.firebaseapp.com", projectId: "sagar-portfolio-dabc5" }));

    onSnapshot(collection(db, "blogs"), snap => {
      const g = document.getElementById('blog-grid');
      g.innerHTML = '';
      snap.forEach(d => {
        const item = d.data();
        g.innerHTML += `
          <div class="card">
            <h3>${item.title}</h3>
            <p style="color:var(--text-sub); margin:0.5rem 0;">${item.metaDescription || ''}</p>
            <a href="/blog/${item.slug}" style="color:var(--neon-cyan); font-weight:bold; text-decoration:none;">Read Article &rarr;</a>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
