<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio & Projects | Sagar Dulal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #05050b; --card-bg: rgba(13, 14, 24, 0.85); --neon-cyan: #00f0ff; --border: rgba(157, 78, 221, 0.2); --text-sub: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: #fff; }
    nav { padding: 1.2rem 8%; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.5rem; font-weight: 900; text-decoration: none; color: #fff; }
    .logo span { color: var(--neon-cyan); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; padding: 4rem 8%; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .card-img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 1.5rem; }
  </style>
</head>
<body>
  <nav><a href="/" class="logo">Sagar <span>Dulal</span></a><div><a href="/" style="color:#fff; text-decoration:none;">Home</a></div></nav>
  <h1 style="text-align:center; margin-top:3rem;">All Published <span>Projects</span></h1>
  <div class="grid" id="projects-grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const db = getFirestore(initializeApp({
      apiKey: "AIzaSyDmsV5ZCHn2BqaOWL0zNa-mq60Y7DX1EhE",
      authDomain: "sagar-portfolio-dabc5.firebaseapp.com",
      projectId: "sagar-portfolio-dabc5"
    }));

    onSnapshot(collection(db, "projects"), snap => {
      const g = document.getElementById('projects-grid');
      g.innerHTML = '';
      snap.forEach(doc => {
        const item = doc.data();
        g.innerHTML += `
          <div class="card">
            ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img"/>` : ''}
            <div class="card-body">
              <h3>${item.title}</h3>
              <p style="color:var(--text-sub); margin: 0.5rem 0;">${item.metaDescription || ''}</p>
              <a href="/project/${item.slug}" style="color:var(--neon-cyan); font-weight:bold; text-decoration:none;">Open Project &rarr;</a>
            </div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
