<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Sagar Dulal</title>
  <meta name="description" content="Explore custom web development and graphic design projects created by Sagar Dulal.">
  <style>
    :root { --bg: #07070d; --card-bg: rgba(255, 255, 255, 0.03); --neon-blue: #00f0ff; --neon-purple: #a855f7; --text: #f3f4f6; --text-muted: #9ca3af; --border: rgba(255, 255, 255, 0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 8%; background: rgba(7, 7, 13, 0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.6rem; font-weight: 800; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); text-decoration: none; }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 2rem; font-weight: 600; }
    nav a.active { color: var(--neon-blue); }
    section { padding: 4rem 8%; }
    h1 { font-size: 2.5rem; margin-bottom: 2rem; color: var(--neon-blue); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); padding: 1.8rem; border-radius: 16px; backdrop-filter: blur(10px); }
    .card h3 { color: #fff; margin-bottom: 0.5rem; }
    .badge { display: inline-block; background: rgba(0, 240, 255, 0.1); color: var(--neon-blue); padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; margin-bottom: 0.8rem; }
    .slug-link { display: inline-block; margin-top: 1rem; color: var(--neon-purple); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">SD | Sagar Dulal</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section>
    <h1>Portfolio Projects</h1>
    <div class="grid" id="project-container">
      <div class="card"><p>Loading projects live from database...</p></div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmsV5ZCHn2BqaOWL0zNa-mq60Y7DX1EhE",
      authDomain: "sagar-portfolio-dabc5.firebaseapp.com",
      projectId: "sagar-portfolio-dabc5",
      storageBucket: "sagar-portfolio-dabc5.firebasestorage.app",
      messagingSenderId: "900240657480",
      appId: "1:900240657480:web:60456aa2d3dfc173f05c7d",
      measurementId: "G-PNW0PFBGCR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProjects() {
      const container = document.getElementById('project-container');
      try {
        const querySnapshot = await getDocs(collection(db, "projects"));
        if (querySnapshot.empty) {
          container.innerHTML = '<div class="card"><p>No projects published yet.</p></div>';
          return;
        }
        container.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const slug = data.slug || doc.id;
          container.innerHTML += `
            <div class="card">
              <span class="badge">${data.category || 'Web Design'}</span>
              <h3>${data.title}</h3>
              <p>${data.description}</p>
              <a href="project-detail.html?slug=${slug}" class="slug-link">View Details (${slug}) →</a>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = '<div class="card"><p>Error connecting to database.</p></div>';
      }
    }
    loadProjects();
  </script>
</body>
</html>
