<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Projects | Sagar Dulal</title>
  <meta name="description" content="Explore custom web development and graphic design projects built by Sagar Dulal.">
  <style>
    :root {
      --bg: #07070d; --card-bg: rgba(255, 255, 255, 0.03); --card-hover: rgba(255, 255, 255, 0.06);
      --neon-blue: #00f0ff; --neon-purple: #a855f7; --text: #f3f4f6; --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 8%; background: rgba(7, 7, 13, 0.85); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
    .logo span { color: var(--neon-blue); }
    nav { display: flex; gap: 2rem; align-items: center; }
    nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    nav a.active { color: var(--neon-blue); }

    section { padding: 5rem 8%; min-height: 80vh; }
    .page-header { margin-bottom: 3rem; }
    .page-header h1 { font-size: 3rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
    .page-header p { color: var(--text-muted); font-size: 1.1rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); padding: 2rem; border-radius: 20px; backdrop-filter: blur(12px); display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    .card:hover { border-color: var(--neon-blue); transform: translateY(-5px); background: var(--card-hover); }
    
    .cat-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); color: var(--neon-purple); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 1rem; width: fit-content; }
    .card h3 { font-size: 1.4rem; color: #fff; margin-bottom: 0.6rem; font-weight: 700; }
    .card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }
    
    .card-footer { border-top: 1px solid var(--border); padding-top: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .slug-tag { font-family: monospace; color: var(--neon-blue); font-size: 0.85rem; }
    .view-link { color: #fff; text-decoration: none; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; transition: gap 0.2s; }
    .view-link:hover { color: var(--neon-blue); gap: 8px; }

    footer { text-align: center; padding: 3rem 8%; border-top: 1px solid var(--border); color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Sagar <span>Dulal</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html" class="active">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section>
    <div class="page-header">
      <h1>Featured Projects</h1>
      <p>Explore real-time dynamic applications and designs fetched directly from Firebase.</p>
    </div>

    <div class="grid" id="project-grid">
      <div class="card"><p>Connecting to database cloud...</p></div>
    </div>
  </section>

  <footer>
    <p>© 2026 Sagar Dulal. Dynamic Portfolio Engine.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmsV5ZCHn2BqaOWL0zNa-mq60Y7DX1EhE",
      authDomain: "sagar-portfolio-dabc5.firebaseapp.com",
      projectId: "sagar-portfolio-dabc5",
      storageBucket: "sagar-portfolio-dabc5.firebasestorage.app",
      messagingSenderId: "900240657480",
      appId: "1:900240657480:web:60456aa2d3dfc173f05c7d",
      measurementId: "G-PNW0PFBGCR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function renderProjects() {
      const grid = document.getElementById('project-grid');
      try {
        const querySnapshot = await getDocs(collection(db, "projects"));
        if (querySnapshot.empty) {
          grid.innerHTML = '<div class="card"><p>No projects published yet. Add projects from admin.html!</p></div>';
          return;
        }
        grid.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const cleanSlug = data.slug || doc.id;
          grid.innerHTML += `
            <div class="card">
              <div>
                <span class="cat-badge">${data.category || 'Development'}</span>
                <h3>${data.title}</h3>
                <p>${data.description}</p>
              </div>
              <div class="card-footer">
                <span class="slug-tag">/${cleanSlug}</span>
                <a href="project-detail.html?slug=${cleanSlug}" class="view-link">View Details →</a>
              </div>
            </div>
          `;
        });
      } catch (err) {
        grid.innerHTML = '<div class="card"><p>Error connecting to database.</p></div>';
      }
    }
    renderProjects();
  </script>
</body>
</html>
