<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
<link rel="stylesheet" href="css/shared.css"></head>
<body>
  <div class="admin-wrapper">
    <aside class="sidebar">
      <nav>
        <div class="nav-group">
          <button class="nav-parent" onclick="toggleSubMenu(this)">
            <span>Projects</span> <span class="chevron">▾</span>
          </button>
          <div class="nav-submenu">
            <button onclick="switchAdminView('projects-add')">Add Project</button>
            <button onclick="switchAdminView('projects-manage')">Manage Projects</button>
          </div>
        </div>

        <div class="nav-group">
          <button class="nav-parent" onclick="toggleSubMenu(this)">
            <span>MCQs</span> <span class="chevron">▾</span>
          </button>
          <div class="nav-submenu">
            <button onclick="switchAdminView('mcq-add')">Add MCQ</button>
            <button onclick="switchAdminView('mcq-manage')">Manage MCQs</button>
          </div>
        </div>
      </nav>
    </aside>

    <main class="main-content" id="admin-content">
      <!-- Dynamic Views Inject Here -->
    </main>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
