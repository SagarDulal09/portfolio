<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Sagar Dulal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-w: 260px;
      --bg-dark: #080911;
      --panel-bg: #10121e;
      --card-bg: #161928;
      --accent-cyan: #00f0ff;
      --accent-purple: #8b5cf6;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; }

    #login-overlay { position: fixed; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .auth-box { background: var(--panel-bg); padding: 3rem; border-radius: 16px; border: 1px solid var(--border-color); width: 360px; text-align: center; }

    #admin-app { display: none; width: 100%; min-height: 100vh; }
    aside { width: var(--sidebar-w); background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 2rem 1rem; display: flex; flex-direction: column; flex-shrink: 0; }
    .admin-brand { font-size: 1.3rem; font-weight: 800; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; color: #fff; }
    .admin-brand span { color: var(--accent-cyan); }
    
    .nav-group { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .nav-btn { display: flex; align-items: center; gap: 12px; padding: 0.9rem 1rem; border-radius: 10px; color: var(--text-muted); background: transparent; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; text-align: left; }
    .nav-btn:hover, .nav-btn.active { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); }

    main { flex: 1; padding: 3rem; overflow-y: auto; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 2rem; margin-bottom: 2rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .full-width { grid-column: span 2; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    input, textarea { width: 100%; padding: 0.85rem; background: #0a0b14; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; margin-top: 0.4rem; outline: none; }
    
    .btn-action { background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan)); border: none; padding: 0.9rem 2rem; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; margin-top: 1rem; width: 100%; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { color: var(--accent-cyan); background: #0a0b14; }
    .btn-del { background: #ef4444; border: none; padding: 0.4rem 0.8rem; color: #fff; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="auth-box">
      <h2>Sagar <span>Admin</span></h2>
      <p style="color:var(--text-muted); margin-bottom:1.5rem;">Database Workspace</p>
      <input type="email" id="auth-email" value="cotact.sagardulal@gmail.com">
      <input type="password" id="auth-pass" placeholder="Password" style="margin-top:0.8rem;">
      <button class="btn-action" onclick="loginAdmin()">Sign In</button>
    </div>
  </div>

  <div id="admin-app">
    <aside>
      <div class="admin-brand">Sagar <span>Workspace</span></div>
      <div class="nav-group">
        <button class="nav-btn active" onclick="switchTab('projects', this)"><i class="fa-solid fa-layer-group"></i> Projects</button>
        <button class="nav-btn" onclick="switchTab('services', this)"><i class="fa-solid fa-screwdriver-wrench"></i> Services</button>
        <button class="nav-btn" onclick="switchTab('blogs', this)"><i class="fa-solid fa-pen-nib"></i> Blogs</button>
      </div>
      <button class="btn-del" onclick="signOutAdmin()" style="width:100%; padding:0.8rem;">Log Out</button>
    </aside>

    <main>
      <div id="pane-projects" class="tab-pane active">
        <h1 style="margin-bottom:1.5rem;">Portfolio Management</h1>
        <div class="card">
          <form id="form-project">
            <div class="form-grid">
              <div><label>Project Name</label><input type="text" id="p-title" required></div>
              <div><label>Category</label><input type="text" id="p-cat" required></div>
              <div><label>Cover Image</label><input type="file" id="p-file" accept="image/*"></div>
              <div class="full-width"><label>Description</label><textarea id="p-desc" rows="3" required></textarea></div>
            </div>
            <button type="submit" class="btn-action">Save to Firestore</button>
          </form>
        </div>
        <div class="card">
          <h3>Saved Projects</h3>
          <table>
            <thead><tr><th>Title</th><th>Category</th><th>Action</th></tr></thead>
            <tbody id="tbl-projects"></tbody>
          </table>
        </div>
      </div>

      <div id="pane-services" class="tab-pane">
        <h1 style="margin-bottom:1.5rem;">Services Management</h1>
        <div class="card">
          <form id="form-service">
            <div class="form-grid">
              <div><label>Service Title</label><input type="text" id="s-title" required></div>
              <div class="full-width"><label>Details</label><textarea id="s-desc" rows="3" required></textarea></div>
            </div>
            <button type="submit" class="btn-action">Save Service</button>
          </form>
        </div>
        <div class="card">
          <h3>Active Services</h3>
          <table>
            <thead><tr><th>Service</th><th>Action</th></tr></thead>
            <tbody id="tbl-services"></tbody>
          </table>
        </div>
      </div>

      <div id="pane-blogs" class="tab-pane">
        <h1 style="margin-bottom:1.5rem;">Blog Articles</h1>
        <div class="card">
          <form id="form-blog">
            <div class="form-grid">
              <div><label>Blog Title</label><input type="text" id="b-title" required></div>
              <div><label>Header Image</label><input type="file" id="b-file" accept="image/*"></div>
              <div class="full-width"><label>Content</label><textarea id="b-content" rows="4" required></textarea></div>
            </div>
            <button type="submit" class="btn-action">Publish Article</button>
          </form>
        </div>
        <div class="card">
          <h3>Published Blogs</h3>
          <table>
            <thead><tr><th>Title</th><th>Action</th></tr></thead>
            <tbody id="tbl-blogs"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDmsV5ZCHn2BqaOWL0zNa-mq60Y7DX1EhE",
    authDomain: "sagar-portfolio-dabc5.firebaseapp.com",
    projectId: "sagar-portfolio-dabc5",
    storageBucket: "sagar-portfolio-dabc5.firebasestorage.app",
    messagingSenderId: "900240657480",
    appId: "1:900240657480:web:60456aa2d3dfc173f05c7d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Authentication Handlers
  window.loginAdmin = async () => {
    try {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      alert("Login Error: " + err.message);
    }
  };

  window.signOutAdmin = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    document.getElementById('login-overlay').style.display = user ? 'none' : 'flex';
    document.getElementById('admin-app').style.display = user ? 'flex' : 'none';
    if(user) listenData();
  });

  // Convert File to Base64 String safely
  const fileToBase64 = (file) => new Promise((resolve) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve('');
  });

  // Save Project Form Submit
  document.getElementById('form-project').addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevents page refresh before database write
    
    try {
      const title = document.getElementById('p-title').value;
      const slug = title.toLowerCase().trim().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-');
      const file = document.getElementById('p-file').files[0];
      const imgData = await fileToBase64(file);

      // Explicit write to Firestore document
      await setDoc(doc(db, "projects", slug), {
        title: title,
        slug: slug,
        category: document.getElementById('p-cat').value,
        description: document.getElementById('p-desc').value,
        imageUrl: imgData,
        timestamp: Date.now()
      });

      alert("Success! Project saved to Firestore.");
      document.getElementById('form-project').reset();
    } catch (err) {
      console.error("Firestore Write Error:", err);
      alert("Firestore Error: " + err.message);
    }
  });

  // Real-time Database Listener
  function listenData() {
    onSnapshot(collection(db, "projects"), (snap) => {
      const tbody = document.getElementById('tbl-projects');
      tbody.innerHTML = '';
      snap.forEach((documentItem) => {
        const data = documentItem.data();
        tbody.innerHTML += `
          <tr>
            <td><b>${data.title}</b></td>
            <td>${data.category}</td>
            <td><button class="btn-del" onclick="delDoc('projects', '${documentItem.id}')">Delete</button></td>
          </tr>`;
      });
    }, (err) => {
      console.error("Firestore Listen Error:", err);
    });
  }

  window.delDoc = async (col, id) => {
    if (confirm("Delete this document?")) {
      await deleteDoc(doc(db, col, id));
    }
  };
</script>
</body>
</html>
