<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Business | Sagar Dulal</title>
  <style>
    :root { --bg: #07070d; --card-bg: rgba(255, 255, 255, 0.03); --neon-blue: #00f0ff; --neon-purple: #a855f7; --text: #f3f4f6; --text-muted: #9ca3af; --border: rgba(255, 255, 255, 0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 8%; background: rgba(7, 7, 13, 0.85); border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
    .logo span { color: var(--neon-blue); }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 2rem; font-weight: 500; }
    nav a.active { color: var(--neon-blue); }
    section { padding: 5rem 8%; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 3rem; margin-bottom: 1rem; color: #fff; font-weight: 800; }
    p.subtitle { color: var(--text-muted); font-size: 1.15rem; margin-bottom: 3rem; }
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .info-card { background: var(--card-bg); border: 1px solid var(--border); padding: 2rem; border-radius: 20px; backdrop-filter: blur(12px); }
    .info-card h3 { color: var(--neon-blue); margin-bottom: 0.5rem; font-size: 1.2rem; }
    .info-card p { font-size: 1.1rem; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Sagar <span>Dulal</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Portfolio</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <section>
    <h1>Let's Connect</h1>
    <p class="subtitle">Have a project in mind or interested in professional computer training classes? Contact me directly.</p>
    
    <div class="contact-grid">
      <div class="info-card">
        <h3>Direct Phone</h3>
        <p>+977 9818178656</p>
      </div>
      <div class="info-card">
        <h3>Email Address</h3>
        <p>cotact.sagardulal@gmail.com</p>
      </div>
      <div class="info-card">
        <h3>Office / Institute</h3>
        <p>Teacher at DIT Solution</p>
      </div>
    </div>
  </section>
</body>
</html>
