<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Apex Digital Solutions</title>
<link rel="stylesheet" href="css/shared.css"></head>
<body>
  <main class="page-container">
    <div class="contact-wrapper">
      <div class="contact-info">
        <h1>Let's Talk About Your Project</h1>
        <p>Fill out the form or email us directly at <strong>hello@apexdigital.com</strong>. We reply within 24 hours.</p>
      </div>

      <form class="form-container" id="contact-form" onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" class="form-control" placeholder="john@company.com" required>
        </div>
        <div class="form-group">
          <label for="message">Project Details</label>
          <textarea id="message" class="form-control" rows="5" placeholder="Tell us about your project goals and timeline..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <div id="contact-status" class="status-msg"></div>
      </form>
    </div>
  </main>

  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      const status = document.getElementById('contact-status');
      status.innerText = "Thank you! Your message has been received. We'll be in touch shortly.";
      status.style.color = "#38bdf8";
      e.target.reset();
    }
  </script>
</body>
</html>
