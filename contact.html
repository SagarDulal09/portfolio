<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | SD Creative Solutions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">SD <span>CREATIVE</span></a>
      <div class="nav-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/services.html">Services</a><a href="/portfolio.html">Work</a><a href="/pricing.html">Pricing</a><a href="/blog.html">Blog</a><a href="/contact.html" class="active">Contact</a>
      </div>
    </nav>
  </header>
  <div class="sec-container">
    <div class="page-title"><h1>Get In <span>Touch</span></h1></div>
    <div style="max-width:600px; margin:0 auto; background:var(--panel-bg); border:1px solid var(--border-line); border-radius:16px; padding:2.5rem;">
      <form onsubmit="event.preventDefault(); alert('Message sent!');">
        <label style="color:var(--neon-cyan); font-weight:bold; font-size:0.8rem;">NAME</label>
        <input type="text" required style="width:100%; padding:0.8rem; background:#080912; border:1px solid var(--border-line); color:#fff; border-radius:8px; margin:0.4rem 0 1rem;">
        <label style="color:var(--neon-cyan); font-weight:bold; font-size:0.8rem;">EMAIL</label>
        <input type="email" required style="width:100%; padding:0.8rem; background:#080912; border:1px solid var(--border-line); color:#fff; border-radius:8px; margin:0.4rem 0 1rem;">
        <label style="color:var(--neon-cyan); font-weight:bold; font-size:0.8rem;">MESSAGE</label>
        <textarea rows="4" required style="width:100%; padding:0.8rem; background:#080912; border:1px solid var(--border-line); color:#fff; border-radius:8px; margin:0.4rem 0 1.5rem;"></textarea>
        <button type="submit" style="width:100%; padding:0.9rem; background:linear-gradient(135deg, var(--neon-violet), var(--neon-cyan)); border:none; border-radius:8px; color:#fff; font-weight:bold;">SEND MESSAGE</button>
      </form>
    </div>
  </div>
</body>
</html>
