<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Blog Article | Sagar Dulal</title>
  <meta name="description" id="page-meta" content="Read full technical article by Sagar Dulal.">
  <style>
    :root { --bg: #05050b; --neon-cyan: #00f0ff; --text-sub: #94a3b8; }
    body { background: var(--bg); color: #fff; font-family: system-ui, sans-serif; padding: 4rem 8%; max-width: 850px; margin: 0 auto; line-height: 1.8; }
    img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 16px; margin: 2rem 0; }
  </style>
</head>
<body>
  <a href="/blog" style="color:var(--neon-cyan); text-decoration:none;">&larr; Back to Articles</a>
  <h1 id="b-title" style="font-size:2.4rem; margin-top:1rem;">Loading...</h1>
  <img id="b-img" style="display:none;">
  <div id="b-body" style="color:var(--text-sub); font-size:1.1rem; whitespace: pre-line;"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const db = getFirestore(initializeApp({ apiKey: "AIzaSyDmsV5ZCHn2BqaOWL0zNa-mq60Y7DX1EhE", authDomain: "sagar-portfolio-dabc5.firebaseapp.com", projectId: "sagar-portfolio-dabc5" }));

    const slug = window.location.pathname.split('/').pop();
    if(slug) {
      getDoc(doc(db, "blogs", slug)).then(snap => {
        if(snap.exists()) {
          const item = snap.data();
          document.getElementById('page-title').innerText = `${item.title} | Sagar Dulal`;
          document.getElementById('page-meta').content = item.metaDescription || '';
          document.getElementById('b-title').innerText = item.title;
          document.getElementById('b-body').innerText = item.content;
          if(item.imageUrl) {
            const img = document.getElementById('b-img');
            img.src = item.imageUrl;
            img.style.display = 'block';
          }
        }
      });
    }
  </script>
</body>
</html>
